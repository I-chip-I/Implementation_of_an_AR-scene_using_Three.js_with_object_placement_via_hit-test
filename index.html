<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Implementation of an AR-scene using Three.js with object placement via hit-test</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link rel="stylesheet" href="Page_Style_Manager.css">
		<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
	</head>
	<body>
		<div class="main-page" id="main-page">
        <h1>AR Hit-test Prototype</h1>
        
        <div style="text-align: left;">
            <h2>Select decoration type:</h2>
        </div>
        <select id="type-selector">
            <option value="">-- Choose type --</option>
            <option value="floor">Floor decor</option>
            <option value="ceiling">Ceiling decor</option>
        </select>

        <div style="text-align: left;">
            <h2>Select model:</h2>
        </div>
        <select id="model-selector" disabled>
            <option value="">-- Choose model --</option>
        </select>

		 <div class="model-demo-window">
            <model-viewer 
                id="model-demo"
                src="" 
                alt="Model preview"
                camera-controls 
                touch-action="pan-y"
                shadow-intensity="1"
                style="width: 100%; height: 100%; background: transparent;">
            </model-viewer>
        </div>

        <button class="use-button" id="use-button" disabled>Use AR</button>
    </div>

	<div class="ar-page-ui" id="ar-page-ui">
        <div class="prompt-banner" id="prompt-banner">
            Loading dependencies
        </div>
        <button class="exit-button" id="exit-button">Exit AR mode</button>
    </div>

	<script type="importmap">
			{
				"imports":
				{
					"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
				}
			}
	</script>

	<script type="module" src="./Modules/Main.js"></script>

	</body>
</html>
